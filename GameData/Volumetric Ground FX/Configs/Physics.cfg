// GroundBlastFx — constantes du modèle physique.
// Une valeur par ligne (le parseur de KSP ne lit qu'un « clé = valeur » par ligne).
// Clé = nom du champ de PhysicsParams (Source/GroundBlastFx/Physics/PhysicsParams.cs). Une clé absente garde sa
// valeur par défaut ; une clé inconnue est signalée dans le log. Les formules en √F utilisent F en kN.
GROUNDBLASTFX_PHYSICS
{
	// --- Jet ---
	plumeHalfAngleSeaLevelDeg = 10
	plumeHalfAngleVacuumDeg = 50
	wallJetKu = 0.3
	wallJetKh = 8
	wallJetDecayExponent = 1.1
	// souffle d'un foyer en atmosphère : u ≈ k · √(F / ρ_air) / h (poussée totale : un gros lanceur souffle de plus haut)
	wallJetMomentumK = 3.5
	impingementPressureMaxPa = 5000000

	// --- Tuyère (estimation depuis la taille de la pièce, sans surcharge dans Engines.cfg) ---
	nozzleExitRadiusFactor = 0.4
	nozzleExitRadiusMinM = 0.05
	nozzleExitRadiusMaxM = 3

	// --- Activation : H_act = k · √(F kN) ; k passe de activationK (atmosphère) à activationKVacuum (vide) ---
	activationK = 4.5
	activationKVacuum = 9
	activationFullFraction = 0.6

	// --- Levée : clamp01((u_i − u_seuil) / u_ref) × érodabilité ---
	liftReferenceVelocityMs = 100
	steamVisibilityThresholdMs = 15

	// --- Nuage : R_max = k_R · √(F kN), front dR/dt = k · u(R) ---
	cloudMaxRadiusK = 3
	cloudMaxRadiusMinM = 6
	cloudFrontSpeedK = 0.35
	postCutoffFrontDecayS = 2.5
	postCutoffSpreadMs = 0.4
	postCutoffMaxGrowth = 1.5
	dissipationMinS = 40
	dissipationMaxS = 150
	dissipationRefRadiusM = 300
	ignitionFadeS = 0.4
	intensitySmoothingS = 0.3

	// --- Fusion des moteurs en foyers, suivi ---
	clusterMergeFactor = 1.5
	clusterMatchMinM = 8
	clusterRelightWindowS = 2

	// --- Pas de tir : verrouillage PRELAUNCH jusqu'à cette altitude au-dessus du site ---
	padLatchAltitudeM = 300

	// --- Échantillonnage ---
	sampleRateHz = 25
	ringRaysLow = 6
	ringRaysHigh = 8

	// --- Milieu ---
	vacuumPressureThresholdPa = 1

	// --- Vide ---
	vacuumEjectaAngleDeg = 2
	vacuumEjectaAngleMinDeg = 1
	vacuumEjectaAngleMaxDeg = 3
	vacuumEjectaSpeedK = 0.5
	vacuumEjectaSpeedMinMs = 100
	vacuumEjectaSpeedMaxMs = 2000
	vacuumCutoffFadeS = 0.2
	vacuumLingerS = 8

	// --- Lumière de flamme ---
	flameLightK = 1
	flameLightFadeS = 0.15

	// --- Traces au sol ---
	scorchPressureRefPa = 20000
	scorchDoseRef = 6
	scorchMinStrength = 0.02
	scorchRadiusFactor = 2.0
	scorchVacuumRadiusFactor = 0.6
	scorchNewMarkDistanceFactor = 0.6
	scorchMaxMarks = 64

	// --- Vent ---
	windVariationPeriodS = 45
}
