// GroundBlastFx — types de surface.
// erodibility       : 0..1, part de poussière qui peut être soulevée
// thresholdVelocity : vitesse pariétale (m/s) en dessous de laquelle rien ne décolle
// steamFraction     : 0..1, part de vapeur (pas de tir avec déluge ≈ 0,9 ; eau ≈ 0,8 ; terrain ≈ 0,05)
// dustA / dustB     : couleurs de la matière soulevée (sinon palette du corps / biome, Configs/Bodies.cfg)
// Les autres mods peuvent patcher ces nœuds avec ModuleManager (@GROUNDBLASTFX_SURFACE:HAS[#kind[Terrain]] { ... }).

GROUNDBLASTFX_SURFACE
{
	kind = Terrain
	erodibility = 0.8
	thresholdVelocity = 40
	steamFraction = 0.05
}
GROUNDBLASTFX_SURFACE
{
	kind = LaunchPad
	erodibility = 0.15
	thresholdVelocity = 120
	steamFraction = 0.9
	dustA = 0.72, 0.71, 0.68, 1
	dustB = 0.56, 0.55, 0.53, 1
}
GROUNDBLASTFX_SURFACE
{
	kind = Structure
	erodibility = 0.1
	thresholdVelocity = 150
	steamFraction = 0.1
	dustA = 0.70, 0.69, 0.66, 1
	dustB = 0.52, 0.51, 0.49, 1
}
GROUNDBLASTFX_SURFACE
{
	kind = Water
	erodibility = 0
	thresholdVelocity = 20
	steamFraction = 0.8
	dustA = 0.92, 0.94, 0.96, 1
	dustB = 0.80, 0.84, 0.88, 1
}
GROUNDBLASTFX_SURFACE
{
	kind = VesselDeck
	erodibility = 0.05
	thresholdVelocity = 150
	steamFraction = 0.4
	dustA = 0.62, 0.62, 0.62, 1
	dustB = 0.46, 0.46, 0.46, 1
}

// Motifs de noms (hiérarchie du collider touché, insensible à la casse) pour reconnaître un pas de tir ou du terrain
// quand ce n'est ni un quad de terrain procédural (PQ) ni le pas de tir stock (tag LaunchpadFX).
// Chaque collider inconnu est noté une fois dans GroundBlastFx.log (« Surface : ... ») : c'est là qu'on trouve
// les noms à ajouter ici.
GROUNDBLASTFX_CLASSIFIER
{
	padPattern = launchpad
	padPattern = launch pad
	padPattern = launch_pad
	padPattern = launchsite
	padPattern = flametrench
	padPattern = flame_trench
	padPattern = flame trench
	padPattern = deflector
	terrainPattern = terrain
	terrainPattern = grass
	terrainPattern = ground
	terrainPattern = soil
	terrainPattern = dirt
}
