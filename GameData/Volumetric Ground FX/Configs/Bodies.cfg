// GroundBlastFx — palettes de sol et vent par corps céleste.
// dustA / dustB : deux teintes de la poussière (claire / sombre), r, g, b, a entre 0 et 1.
// windMin / windMax : vent de surface tiré une fois par session (m/s). 0 / 0 = pas de vent.
// erodibilityScale / thresholdScale : multiplicateurs appliqués au type « Terrain » de Surfaces.cfg.
// BIOME { name = ... } : surcharge par biome. Les noms exacts sont ceux de la carte des biomes du jeu ;
// chaque biome rencontré est noté dans GroundBlastFx.log (« Biome rencontré : ... ») pour enrichir cette liste.

