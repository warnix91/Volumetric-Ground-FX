// GroundBlastFx — sites de lancement.
// match            : texte cherché dans vessel.landedAt ou dans le nom du collider / du site Kerbal Konstructs
// trenchHeadingDeg : axe de la tranchée de déflexion (degrés depuis le nord, sens horaire) ; -1 = radial
// deluge           : true = système de déluge (vapeur massive), false = pas d'eau (poussière de béton, peu de vapeur)
// Les bouches de fumée déclarées par un pas de tir sont utilisées en priorité. Ce cap est un repli de compatibilité.
// Le premier nœud qui correspond gagne : mettre les noms les plus précis en premier.

// Sites Making History (pas de déluge)
GROUNDBLASTFX_LAUNCHSITE
{
	match = Desert_Launch_Site
	trenchHeadingDeg = -1
	deluge = false
}
GROUNDBLASTFX_LAUNCHSITE
{
	match = Woomerang_Launch_Site
	trenchHeadingDeg = -1
	deluge = false
}

// Pas de tir du KSC (stock) et nom générique
GROUNDBLASTFX_LAUNCHSITE
{
	match = LaunchPad
	// 1.0.1 : bouches nord et sud du pas du KSC (270 donnait des jets est-ouest)
	trenchHeadingDeg = 0
	deluge = true
}
