// GroundBlastFx — surcharges optionnelles du diamètre de sortie de tuyère.
// Sans surcharge, le rayon de sortie est estimé depuis la taille du modèle de la pièce (≈ 0,4 × diamètre),
// réparti entre les tuyères d'une même pièce. Chaque estimation est notée une fois dans GroundBlastFx.log
// (« Tuyère estimée : <nom> ... ») : copier le nom de la pièce ici pour corriger une valeur.
// part = nom interne de la pièce (celui du log), nozzleExitDiameter = diamètre de sortie en mètres.

// Exemples RO / ROEngines (noms à confirmer dans le journal du jeu) :
GROUNDBLASTFX_ENGINE
{
	part = ROE-Merlin1D
	nozzleExitDiameter = 0.92
}
GROUNDBLASTFX_ENGINE
{
	part = ROE-Merlin1DV
	nozzleExitDiameter = 3.3
}
GROUNDBLASTFX_ENGINE
{
	part = ROE-RS25
	nozzleExitDiameter = 2.3
}
GROUNDBLASTFX_ENGINE
{
	part = ROE-F1
	nozzleExitDiameter = 3.7
}
GROUNDBLASTFX_ENGINE
{
	part = ROE-LMDE
	nozzleExitDiameter = 1.54
}
GROUNDBLASTFX_ENGINE
{
	part = ROE-Raptor
	nozzleExitDiameter = 1.3
}
GROUNDBLASTFX_ENGINE
{
	part = ROE-BE4
	nozzleExitDiameter = 1.8
}

// Stock (valeurs cohérentes avec la taille des modèles) :
GROUNDBLASTFX_ENGINE
{
	part = liquidEngine
	nozzleExitDiameter = 0.9
}
GROUNDBLASTFX_ENGINE
{
	part = liquidEngine2
	nozzleExitDiameter = 0.85
}
GROUNDBLASTFX_ENGINE
{
	part = liquidEngine3.v2
	nozzleExitDiameter = 0.45
}
GROUNDBLASTFX_ENGINE
{
	part = engineLargeSkipper
	nozzleExitDiameter = 1.9
}
GROUNDBLASTFX_ENGINE
{
	part = liquidEngineMainsail.v2
	nozzleExitDiameter = 2.1
}
