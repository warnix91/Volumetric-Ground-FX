// GroundBlastFx — lumière de flamme et part de vapeur selon les ergols.
// L'ordre compte : pour chaque moteur, le PREMIER nœud dont « match » est contenu dans le nom d'un de ses ergols gagne.
// Les carburants sont donc listés avant les oxydants. Noms RealFuels et stock.
// color     : teinte de la lumière de flamme au sol (r, g, b)
// intensity : force relative de la lumière (kérolox = 1)
// steamBonus: part de vapeur ajoutée (l'hydrolox produit beaucoup de vapeur d'eau)
// soot     : noircissement du sol par la suie (kérolox 1 ; méthalox et hydrolox brûlent presque sans suie)
// Lumière du méthalox : jaune-orangé (photos des décollages de Starship), pas bleue : c'est la couleur que prend le nuage.

// --- Kérolox ---
GROUNDBLASTFX_PROPELLANT_LIGHT
{
	match = Kerosene
	color = 1.00, 0.62, 0.30
	intensity = 1.0
	steamBonus = 0.0
	soot = 1.0
