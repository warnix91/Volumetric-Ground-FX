// GroundBlastFx — réglages par défaut.
// Au premier lancement, ils sont copiés dans PluginData/Settings.cfg, qui est ensuite modifié par la fenêtre en jeu.
// Le niveau de détail du rendu est identique sur toutes les machines. language = auto : langue du jeu (sinon fr, en, de…).
GROUNDBLASTFX_SETTINGS
{
	quality = Ultra
	enableDust = True
	enablePadSteam = True
	enableWater = True
	enableVacuumEjecta = True
	enableScorch = True
	enableFlameGroundLight = True
	globalIntensity = 1
	effectBrightness = 0.85
	ignitionStrength = 1
	maxRenderDistanceM = 5000
	maxRenderedClusters = 4
	rendererDebugView = False
	hideStockSurfaceFX = True
	persistentMarks = True
	showOverlay = False
	showDemoLabels = False
	language = auto
	windowX = 240
	windowY = 120
}
